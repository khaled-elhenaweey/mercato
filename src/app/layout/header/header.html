<header class="w-full border-b border-slate-200 bg-white font-sans shadow-sm" dir="ltr">
  <div class="mx-auto flex max-w-7xl items-center justify-between gap-2 px-4 py-3 sm:px-6 lg:px-8">

    <!-- Logo & Nav Links -->
    <div class="flex items-center gap-6 lg:gap-8">
      <!-- Logo -->
      <a href="#" class="flex items-center gap-2 text-xl font-bold text-blue-900 shrink-0">
        <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-blue-900 text-white shadow-md">
          <mat-icon class="flex! items-center! justify-center!">storefront</mat-icon>
        </span>
        <span class="tracking-tight">Mercato</span>
      </a>

      <!-- Navigation Links -->
      <nav class="hidden items-center gap-5 xl:gap-6 lg:flex">
        <a href="#" class="text-sm font-semibold text-blue-900 transition hover:text-blue-700">Home</a>
        <a href="#" class="text-sm font-medium text-slate-600 transition hover:text-blue-900">offers</a>
      </nav>
    </div>

    <!-- Search Bar Component Integration -->
    <div class="hidden flex-1 max-w-sm md:max-w-md mx-4 md:block">
      <app-search-bar />
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-2.5">

      <!-- Cart Icon -->
      <button
        class="relative flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 text-slate-700 transition hover:bg-slate-50 hover:text-blue-900 shrink-0"
        aria-label="Shopping Cart">
        <mat-icon class="flex! items-center! justify-center!">shopping_cart</mat-icon>
        <span
          class="absolute -top-1.5 -right-1.5 flex h-5 w-5 items-center justify-center rounded-full bg-emerald-600 text-[11px] font-bold text-white shadow-sm">3</span>
      </button>

      @if (authService.isLoggedIn()) {
      <!-- User Profile & Logout -->
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2">
          <img [src]="authService.currentUser()?.image" alt="Avatar"
            class="h-9 w-9 rounded-full border border-slate-200 object-cover" />
          <span class="hidden text-sm font-semibold text-slate-700 md:inline">
            {{ authService.currentUser()?.firstName }}
          </span>
        </div>
        <button (click)="authService.logout()"
          class="flex h-10 w-10 items-center justify-center rounded-xl border border-red-100 bg-red-50 text-red-600 transition hover:bg-red-100 shrink-0"
          title="Logout">
          <mat-icon class="flex! items-center! justify-center! text-lg!">logout</mat-icon>
        </button>
      </div>
      } @else {
      <!-- Sign In Button -->
      <a routerLink="/login"
        class="flex items-center gap-2 rounded-xl bg-blue-900 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-800 active:scale-95 shrink-0">
        <mat-icon class="flex! items-center! justify-center! text-lg!">login</mat-icon>
        <span>Sign In</span>
      </a>
      }

      <!-- Mobile Menu Button -->
      <button
        class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 text-slate-700 transition hover:bg-slate-50 lg:hidden shrink-0"
        aria-label="Open Menu">
        <mat-icon class="flex! items-center! justify-center!">menu</mat-icon>
      </button>
    </div>
  </div>
</header>
